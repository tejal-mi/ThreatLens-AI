<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="none" role="img" aria-label="ThreatLens Logo">
  <defs>
    <linearGradient id="tlEmblemGrad" x1="4" y1="4" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#2C6CB0" />
      <stop offset="100%" stop-color="#0d1b2a" />
    </linearGradient>
    <linearGradient id="tlAccentGrad" x1="22" y1="8" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#2C6CB0" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="tlCoreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <filter id="tlGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#00F2FE" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Hexagonal Shield Frame -->
  <path
    d="M22 3.5L38.5 13V31L22 40.5L5.5 31V13L22 3.5Z"
    fill="#070c18"
    stroke="url(#tlCoreGrad)"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <!-- Faceted Top-Right Shard -->
  <path
    d="M22 3.5L38.5 13L28.5 22L22 15V3.5Z"
    fill="url(#tlAccentGrad)"
  />

  <!-- Faceted Left Shard -->
  <path
    d="M5.5 13L22 3.5V15L12 24.5L5.5 13Z"
    fill="url(#tlEmblemGrad)"
    opacity="0.95"
  />

  <!-- Bottom Anchor Facet -->
  <path
    d="M22 40.5L5.5 31L16 26L22 30L28 26L38.5 31L22 40.5Z"
    fill="#0a162e"
    stroke="url(#tlCoreGrad)"
    stroke-width="1.2"
  />

  <!-- Central Diamond Lens Core -->
  <polygon
    points="22,12 30,22 22,32 14,22"
    fill="#040814"
    stroke="url(#tlCoreGrad)"
    stroke-width="1.8"
    filter="url(#tlGlow)"
  />

  <!-- Focal Lens Aperture -->
  <circle cx="22" cy="22" r="3.5" fill="#00F2FE" />
  <circle cx="22" cy="22" r="1.5" fill="#FFFFFF" />

  <!-- Precision Scan Line -->
  <line x1="7" y1="22" x2="37" y2="22" stroke="#00F2FE" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.85" />
</svg>
